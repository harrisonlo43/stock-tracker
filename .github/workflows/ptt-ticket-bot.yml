name: PTT 售票通知

on:
  schedule:
    - cron: "*/5 * * * *"  # 每 5 分鐘（GitHub 排程常會延遲幾分鐘）
  workflow_dispatch:       # 也可以在 Actions 頁面手動執行

permissions:
  contents: write  # 用來把 seen.json（已通知清單）存回 repo

concurrency:
  group: ptt-ticket-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ptt_ticket_bot/requirements.txt

      - run: pip install -r ptt_ticket_bot/requirements.txt

      - name: 掃描 PTT 並發送 WhatsApp 通知
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: python ptt_ticket_bot/bot.py

      - name: 儲存已通知清單
        if: always()
        run: |
          git add ptt_ticket_bot/seen.json
          git diff --cached --quiet && exit 0
          git config user.name "harrisonlo43"
          git config user.email "harrisonlo43@gmail.com"
          git commit -m "PTT 售票通知：更新已通知清單"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
